<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p3 views model: interactive mockups</title>
<style>
/* p2 design tokens (apps/p2/src/web/style.css, dark theme) */
:root{--bg:#151413;--text:#ecebe8;--muted:#9b958d;--faint:#6c6761;--line:#2c2a27;--hover:#22201e;--user:#252321;--code:#1a1918;--ok:#5cc493;--unread:#5b9cf0;--working:#f59e42;--bad:#f07a72;--add:#17301f;--add-ink:#7fd8a3;--del:#3a1d1b;--del-ink:#f4a19a;--scrim:rgb(0 0 0/.45);
--x:16px;--bar:52px;--row:44px;--radius:4px;--fs-xs:11px;--fs-sm:13px;--fs-md:15px;--fs-lg:17px;--fs-code:12px;
--sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,monospace;
/* mockup-only: ownership colours */
--wb:#5b9cf0;--pl:#f59e42}
*{box-sizing:border-box}
html,body{margin:0;background:#0e0d0c;color:var(--text);font:var(--fs-sm)/1.45 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:var(--fs-code)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
/* page nav */
nav.screens{position:sticky;top:0;z-index:100;background:rgba(14,13,12,.96);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;padding:8px 14px;align-items:center}
nav.screens .brand{font-weight:600;margin-right:12px}
nav.screens button{background:none;border:1px solid transparent;color:var(--muted);padding:4px 10px;border-radius:var(--radius);font-size:12.5px}
nav.screens button:hover{color:var(--text)}
nav.screens button.on{color:var(--text);border-color:var(--line);background:var(--hover)}
nav.screens .own{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
main{padding:16px 18px 40px;max-width:1400px;margin:0 auto}
section.screen{display:none}section.screen.on{display:block}
.cap{max-width:1000px;margin:0 0 12px;color:var(--muted)}
.cap b{color:var(--text);font-weight:600}
.cap .src{font-size:var(--fs-xs);color:var(--faint);margin-top:4px}
/* app window */
.win{position:relative;height:680px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.fixedbar{height:30px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;background:#0f0e0d;border-bottom:1px solid var(--line);font-size:12px}
.fixedbar .fb{background:none;border:1px solid transparent;border-radius:var(--radius);color:var(--muted);padding:2px 8px}
.fixedbar .fb:hover{color:var(--text);background:var(--hover)}
.fixedbar .fb.on{color:var(--working);border-color:rgba(245,158,66,.4)}
.fixedbar .title{color:var(--faint);margin:0 8px}
.fixedbar .sp{flex:1}
.body{flex:1;display:flex;min-height:0;position:relative}
/* panes */
.split{display:flex;min-width:0;min-height:0;flex:1}
.split.col{flex-direction:column}
.split>*+*{border-left:1px solid var(--line)}
.split.col>*+*{border-left:0;border-top:1px solid var(--line)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;position:relative}
.chrome{height:34px;flex:none;display:flex;align-items:stretch;background:#191817;border-bottom:1px solid var(--line);font-size:12.5px}
.chrome .tab{display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);border-right:1px solid var(--line);background:none;border-top:0;border-bottom:0;border-left:0;white-space:nowrap}
.chrome .tab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 2px 0 var(--text)}
.chrome .tab .x{opacity:.5;font-size:11px;padding:0 2px}
.chrome .tab .x:hover{opacity:1}
.chrome .ptitle{display:flex;align-items:center;padding:0 12px;color:var(--text)}
.chrome .sp{flex:1}
.chrome .act{background:none;border:0;color:var(--muted);padding:0 10px}
.chrome .act:hover{color:var(--text)}
.content{flex:1;min-height:0;overflow:auto;position:relative}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);height:18px;white-space:nowrap}
.badge.sk{color:var(--working);border-color:rgba(245,158,66,.45)}
.badge.pl{color:var(--ok);border-color:rgba(92,196,147,.45)}
.badge.gl{color:var(--unread);border-color:rgba(91,156,240,.45)}
/* ownership overlay */
body.own .wbo{outline:1.5px dashed var(--wb);outline-offset:-2px}
body.own .plo{outline:1.5px dashed var(--pl);outline-offset:-3px}
body.own .owntag{display:block}
.owntag{display:none;position:absolute;right:6px;bottom:6px;font-size:10px;padding:1px 6px;border-radius:3px;z-index:5;pointer-events:none}
.owntag.w{background:var(--wb);color:#0b1220}.owntag.p{background:var(--pl);color:#1d1205}
.legend{display:inline-flex;gap:10px;font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;border:1.5px dashed;margin-right:4px;vertical-align:-1px}
/* sidebar */
.side{width:250px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .head{height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 var(--x);border-bottom:1px solid var(--line)}
.side .head select,.sel{background:var(--hover);border:1px solid var(--line);color:var(--text);border-radius:var(--radius);padding:3px 6px;font:inherit}
.side .grp{padding:12px var(--x) 4px;font-size:var(--fs-xs);color:var(--faint);text-transform:uppercase;letter-spacing:.6px}
.side .it{display:flex;align-items:center;gap:8px;padding:7px var(--x);color:var(--muted);cursor:pointer}
.side .it:hover{background:var(--hover)}
.side .it.on{color:var(--text);background:var(--hover)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.w{background:var(--working)}.dot.u{background:var(--unread)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
/* transcript */
.tx{padding:16px var(--x) 8px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.msg.user{align-self:flex-end;background:var(--user);padding:8px 12px;border-radius:10px;max-width:80%}
.msg.agent{color:var(--text)}
.msg.agent p{margin:0 0 6px}
.toolrow{font-family:var(--mono);font-size:var(--fs-code);color:var(--muted);display:flex;gap:8px;align-items:center}
.toolrow b{color:var(--text);font-weight:500}
.composer{flex:none;border-top:1px solid var(--line);padding:10px var(--x);position:relative}
.composer .box{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#1a1918}
.composer .ph{color:var(--faint);min-height:22px}
.composer .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.composer .send{margin-left:auto;background:var(--text);color:var(--bg);border:0;border-radius:var(--radius);padding:3px 12px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--hover);border:1px solid var(--line);color:var(--muted)}
.chip .x{cursor:pointer}
/* diff */
.diff{font-family:var(--mono);font-size:var(--fs-code);line-height:1.6;white-space:pre}
.diff .f{padding:8px var(--x);color:var(--text);border-bottom:1px solid var(--line);background:#181716;position:sticky;top:0}
.diff .h{color:var(--unread);padding:0 var(--x)}
.diff .a{background:var(--add);color:var(--add-ink);padding:0 var(--x)}
.diff .d{background:var(--del);color:var(--del-ink);padding:0 var(--x)}
.diff .c{color:var(--muted);padding:0 var(--x)}
.diff .sel{background:rgba(91,156,240,.25);outline:1px solid var(--unread)}
/* markdown */
.md{padding:16px 20px;max-width:680px;font-size:14px}
.md h1{font-size:20px;margin:0 0 10px;font-family:Georgia,serif}
.md h2{font-size:15px;margin:16px 0 6px}
.md p,.md li{color:#d6d3cd}
.md code{background:var(--code);padding:1px 4px;border-radius:3px}
/* sketch frame */
.frame{margin:10px;border:1px solid var(--line);border-radius:6px;background:#121110;position:relative;overflow:hidden}
.frame .fhd{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);padding:4px 8px;border-bottom:1px dashed var(--line)}
.ck{padding:10px 14px}
.ck label{display:flex;gap:8px;align-items:center;padding:5px 0;cursor:pointer}
.ck input{accent-color:var(--ok)}
.ck label.done span{color:var(--muted);text-decoration:line-through}
/* toast */
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#2a2826;border:1px solid #3d3a36;border-radius:8px;padding:9px 12px 9px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20;white-space:nowrap}
.toast .b{background:none;border:1px solid #4a4642;border-radius:var(--radius);padding:2px 10px}
.btn{background:var(--hover);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;color:var(--text)}
.btn:hover{border-color:#47433e}
.btn.p{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.ok{color:var(--ok);border-color:rgba(92,196,147,.45)}
.btn.bad{color:var(--bad);border-color:rgba(240,122,114,.45)}
/* error boundary */
.eb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#171615 0 10px,#1a1817 10px 20px)}
.eb .card{border:1px solid rgba(240,122,114,.5);background:#1c1a19;border-radius:8px;padding:16px 18px;max-width:380px}
.eb h3{margin:0 0 6px;font-size:14px;color:var(--bad)}
.eb pre{font-family:var(--mono);font-size:11px;color:var(--muted);background:#141312;border:1px solid var(--line);border-radius:4px;padding:6px 8px;white-space:pre-wrap;margin:8px 0 12px}
/* banner */
.banner{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(245,158,66,.1);border-bottom:1px solid rgba(245,158,66,.4);color:#f3d2ab}
.banner .sp{flex:1}
/* plugin manager */
.pm{padding:12px var(--x)}
.pm .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pm .row .nm{font-weight:500}
.pm .row .sp{flex:1}
.tog{width:32px;height:18px;border-radius:9px;background:#3a3733;position:relative;border:0;flex:none}
.tog:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#bbb;transition:left .15s}
.tog.on{background:var(--ok)}.tog.on:after{left:16px;background:#fff}
/* glyph */
.glyph{display:grid;grid-template-columns:repeat(8,26px);gap:2px;padding:12px;justify-content:center}
.glyph i{width:26px;height:26px;background:#24221f;border-radius:2px;cursor:pointer}
.glyph i.on{background:var(--text)}
.glyph.p3 i{border-radius:3px}
.preview{display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 0 12px;color:var(--muted);font-size:11px}
.preview canvas{image-rendering:pixelated;background:#24221f;border-radius:2px}
/* inbox */
.ib{padding:6px 0}
.ib .q{padding:10px var(--x);border-bottom:1px solid var(--line);cursor:pointer}
.ib .q:hover{background:var(--hover)}
.ib .q.on{background:var(--hover);box-shadow:inset 2px 0 0 var(--working)}
.ib .q .s{font-size:11px;color:var(--faint);display:flex;gap:6px;align-items:center}
.ib .q .t{margin:3px 0 6px}
/* approval entry */
.appr{border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.appr .hd{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#1b1a18;border-bottom:1px solid var(--line);font-size:12px}
.appr .bd{padding:10px 12px}
.appr pre{margin:0 0 10px;font-family:var(--mono);font-size:var(--fs-code);background:var(--code);padding:8px 10px;border-radius:4px;border:1px solid var(--line);white-space:pre-wrap}
.slotnote{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
/* phone */
.phonewrap{display:flex;gap:40px;justify-content:center;align-items:flex-start}
.phone{width:380px;height:760px;border-radius:44px;border:10px solid #2a2826;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px #3a3733}
.phone .status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:12px;font-weight:600}
.phone .top{height:var(--bar);flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line)}
.phone .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--muted);font-size:18px}
.phone .strip{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.phone .strip button{background:none;border:0;color:var(--muted);padding:9px 14px;white-space:nowrap;border-bottom:2px solid transparent}
.phone .strip button.on{color:var(--text);border-bottom-color:var(--text)}
.phone .pbody{flex:1;min-height:0;overflow:auto;position:relative}
.phone .pfixed{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#0f0e0d;padding:6px 0 18px;font-size:11px}
.phone .pfixed button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.drawer{position:absolute;inset:0;z-index:30;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer .panel{position:absolute;left:0;top:0;bottom:0;width:82%;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column}
/* terminal */
.term{background:#0b0b0a;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.38;color:#d6d3cd;white-space:pre;overflow:auto}
.term .k{color:var(--working)}.term .g{color:var(--ok)}.term .r{color:var(--bad)}.term .b{color:var(--unread)}.term .m{color:#6c6761}.term .inv{background:#d6d3cd;color:#0b0b0a}
.term .bx{display:inline-block;width:1ch;text-align:center;overflow:visible}
.term .lnk{color:var(--unread);text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.seg button{background:none;border:0;padding:4px 12px;color:var(--muted)}
.seg button.on{background:var(--hover);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lbl{font-size:var(--fs-xs);color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px}
</style>
</head>
<body>
<nav class="screens" id="nav"><span class="brand">p3 views</span>
<span class="own"><label><input type="checkbox" id="owntog"> show who draws what</label><span class="legend"><span><i style="border-color:var(--wb)"></i>workbench</span><span><i style="border-color:var(--pl)"></i>plugin view</span></span></span></nav>
<main id="main"></main>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- shared fake content ---------- */
const SESSIONS=[["p3 views proposal","w",1],["kit-owner build","bad"],["astra review","w"],["Discord plugin design","ok"],["Journal",""],["slayer CVE check","ok"]];
function sidebar(active="p3 views proposal",{kindSelect=true}={}){
  return `<div class="side plo" style="position:relative"><div class="head">${kindSelect?`<select class="sel" data-act="globalkind"><option>Sessions</option><option>Inbox</option><option>Dashboard</option></select>`:"<b>Sessions</b>"}<span style="flex:1"></span><span class="muted">+</span></div>
  <div class="grp">pi · slayer:~/pi</div>
  ${SESSIONS.map(([n,d])=>`<div class="it ${n===active?"on":""}"><span class="dot ${d}"></span>${n}</div>`).join("")}
  <div class="grp">journal · phone</div><div class="it"><span class="dot"></span>Journal: weekly</div>
  <span class="owntag p">Sidebar({}) · global view · plugin sessions</span></div>`;
}
function transcript({extra="",composerExtra="",compact=false}={}){
  return `<div class="tx">
  <div class="msg user">Mock up the views model from apps/p3/docs/views.md. Keep the Changes pane and the doc open.</div>
  <div class="msg agent"><p>Opened the proposal and the working tree's changes. The model has three concepts: <b>view kinds</b> (typed, with params), <b>renderers</b> per surface, and <b>slots</b> inside views.</p>
  <div class="toolrow">▸ <b>view</b> open Markdown({ path: "apps/p3/docs/views.md" })</div>
  <div class="toolrow">▸ <b>view</b> open Changes({ session, path: "plugins/changes" })</div>
  <div class="toolrow">▸ <b>view</b> open sketch "Release checklist"</div></div>
  ${compact?"":`<div class="msg user">Why is the session decided by the params?</div>
  <div class="msg agent"><p>A kind whose params name a <code>session</code> belongs to that session's workspace; a kind without one is global, such as <code>Sidebar({})</code> or <code>Inbox({})</code>. No flag to keep in sync.</p></div>`}
  ${extra}
  </div>`;
}
function composer(extra=""){return `<div class="composer plo"><div class="box"><div class="ph">Message p3 views proposal…</div><div class="row">${extra}<button class="send">Send</button></div></div><span class="owntag p">Composer · slots: ComposerParts</span></div>`}
const DIFF=`<div class="diff"><div class="f">plugins/changes/contract.web.ts  <span class="muted">+6 −1</span></div><div class="h">@@ -1,4 +1,9 @@</div><div class="c">  import { defineViewKind, str } from "../views/contract.ts"</div><div class="d">- export const CHANGES = "changes"</div><div class="a">+ /** The working tree's diffs, optionally below a path. */</div><div class="a">+ export const Changes = defineViewKind("changes", {</div><div class="a">+   session: str(),</div><div class="a">+   path: str(),</div><div class="a">+ })</div><div class="c"> </div><div class="f">plugins/changes/web.tsx  <span class="muted">+3 −0</span></div><div class="h">@@ -12,6 +12,9 @@ export default definePlugin(…)</div><div class="c">   self.contribute(WebViews, {</div><div class="a">+    [Changes.name]: ({ params }) =&gt;</div><div class="a">+      &lt;ChangesPane session={params.session} path={params.path} /&gt;,</div><div class="c">   })</div><div class="f">plugins/views/registries.ts  <span class="muted">+8 −0</span></div><div class="h">@@ -0,0 +1,8 @@</div><div class="a">+ export const WebViews = defineRegistry&lt;WebViewRenderer&gt;("WebViews")</div><div class="a">+ export const TuiViews = defineRegistry&lt;TuiViewRenderer&gt;("TuiViews")</div></div>`;
const MD=`<div class="md"><h1>p3 views: the web and terminal UI model</h1><p class="muted" style="font-size:12px">apps/p3/docs/views.md · proposal</p><h2>2. The model: three concepts</h2><ol><li><b>View kind:</b> a name and params, <code>Transcript({ session, conversation })</code>, <code>Changes({ session, path })</code>, <code>Sidebar({})</code>.</li><li><b>Renderer:</b> a component per kind and surface, in <code>WebViews</code> and <code>TuiViews</code>.</li><li><b>Slot:</b> named extension points a kind declares, such as <code>TranscriptEntries</code> and <code>ComposerParts</code>.</li></ol><h2>3. The workbench and the escape hatch</h2><p>Pane chrome is the workbench's. Every pane renders inside an error boundary. A small fixed bar stays: views menu, layout reset, safe mode.</p></div>`;
function checklist(id){const items=[["Workbench owns pane chrome",1],["Error boundary per pane",1],["Safe mode flag",0],["Phone drawer for global views",0],["TUI fallback for kinds without renderer",0]];
  return `<div class="ck" data-ck="${id}"><div style="font-weight:600;margin-bottom:6px">Release checklist</div>${items.map(([t,d],i)=>`<label class="${d?"done":""}"><input type="checkbox" ${d?"checked":""} data-act="ck"><span>${t}</span></label>`).join("")}<div class="muted" style="font-size:11px;margin-top:8px">state: JSON, saved through the bridge</div></div>`}
function sketch(id){return `<div class="frame"><div class="fhd"><span class="badge sk">sketch, sandboxed</span><span>iframe · opaque origin · p3 tokens + components injected</span></div>${checklist(id)}</div>`}

/* ---------- pane helper: workbench chrome + plugin content ---------- */
function pane({tabs,active=0,id,content,kindLabel,menu=true,flex=1}){
  const t=tabs.map((x,i)=>`<button class="tab ${i===active?"on":""}" data-act="tab" data-pane="${id}" data-i="${i}">${x}<span class="x" data-act="closetab">✕</span></button>`).join("");
  const c=Array.isArray(content)?content:[content];
  return `<div class="pane" style="flex:${flex}" data-pane-id="${id}"><div class="chrome wbo" style="position:relative">${t}<span class="sp"></span>${menu?`<button class="act" title="pane menu">⋯</button><button class="act" title="split">◫</button><button class="act" title="close pane">✕</button>`:""}<span class="owntag w">pane chrome · workbench</span></div>
  ${c.map((x,i)=>`<div class="content plo" data-tabc="${id}" style="${i===active?"":"display:none"}">${x}<span class="owntag p">${(kindLabel&&kindLabel[i])||"plugin view"}</span></div>`).join("")}</div>`;
}
function fixedbar(title="p3 views proposal",{safe=false}={}){

function vis(s){return s.replace(/<[^>]+>/g,"").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&")}
