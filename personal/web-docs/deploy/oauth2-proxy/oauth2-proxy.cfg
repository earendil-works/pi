# oauth2-proxy v7.x Konfiguration für docs.og-monschau.de
# Doku: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
#
# OAuth-Provider: Google (separat in Google Cloud Console einzurichten,
# siehe ../README.md → "Google OAuth Setup").
#
# Sensible Werte (CLIENT_ID, CLIENT_SECRET, COOKIE_SECRET) kommen NICHT in
# diese Datei, sondern via /etc/web-docs-oauth2-proxy.env (chmod 600 root:opipi).

provider = "google"
provider_display_name = "Google"

# Auf welcher Adresse oauth2-proxy hört (nginx proxypassed dahin)
http_address = "127.0.0.1:4180"
reverse_proxy = true

# Wer darf rein? Nur Olivers eigene Adresse.
email_domains = ["*"]
authenticated_emails_file = "/home/opipi/web-docs/deploy/oauth2-proxy/allowed-emails.txt"

# Public URL der App (für Redirects)
redirect_url = "https://docs.og-monschau.de/oauth2/callback"
whitelist_domains = ["docs.og-monschau.de"]

# Cookie-Settings: HTTPS-only, lange Session
cookie_name = "_web_docs_oauth2"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"   # 7 Tage Login-Persistenz
cookie_refresh = "60m"
cookie_domains = ["docs.og-monschau.de"]

# Headers, die an das Backend (nginx → static / proxy) durchgereicht werden
pass_user_headers = true
pass_access_token = false
pass_authorization_header = false
set_xauthrequest = true

# Skip Sign-In-Page direkt zu Google (User klickt nur Google-Button)
skip_provider_button = true

# Logging
silence_ping_logging = true
request_logging = true
auth_logging = true
standard_logging = true

# Healthchecks erlauben (für nginx + Monitoring)
ping_path = "/oauth2/ping"
