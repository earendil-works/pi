# /etc/nginx/sites-available/docs.og-monschau.de.conf
# Aktiviert per Symlink in /etc/nginx/sites-enabled/
#
# Architektur:
#   Browser → 443 → nginx (TLS, Let's Encrypt)
#                 ├─ /oauth2/* → oauth2-proxy (127.0.0.1:4180)
#                 ├─ /api/proxy/* → CORS-Mini-Proxy (127.0.0.1:8090) [auth_request gated]
#                 └─ /* → Static Files /home/opipi/web-docs/dist/   [auth_request gated]

# HTTP → HTTPS Redirect
server {
	listen 80;
	listen [::]:80;
	server_name docs.og-monschau.de;

	# ACME-Challenge für certbot durchlassen
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://$server_name$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name docs.og-monschau.de;

	# TLS-Cert von certbot (gleiche Konvention wie arbeitsmarkt-, openbrain-,
	# rechtsrecherche-Subdomains)
	ssl_certificate /etc/letsencrypt/live/docs.og-monschau.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/docs.og-monschau.de/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# Security-Header
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "no-referrer" always;
	# CSP: Streng, aber passend zu pi-web-ui (das Sandbox-iframes für Artifacts nutzt)
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

	# robots: nicht indexieren (private App)
	add_header X-Robots-Tag "noindex, nofollow" always;

	# Body-Size: Dokumenten-Uploads (PDF/DOCX) werden im Browser geparst und nur als
	# Text an Backend → typisch <500 KB. Großzügig auf 5 MB für Edge-Cases (große
	# Multi-Sheet-XLSX werden zwar im Browser geparst, aber Settings-API könnte ggf.
	# JSON-Bodies dieser Größe sehen).
	client_max_body_size 5m;

	# ====== oauth2-proxy: Login + Auth-Endpoints ======
	location /oauth2/ {
		proxy_pass http://127.0.0.1:4180;
		proxy_set_header Host $server_name;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $server_name;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Endpoint für nginx auth_request: liefert 202 Accepted (eingeloggt) oder 401
	location = /oauth2/auth {
		internal;
		proxy_pass http://127.0.0.1:4180;
		proxy_set_header Host $server_name;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $server_name;
		proxy_set_header X-Original-URI $request_uri;
		proxy_set_header Content-Length "";
		proxy_pass_request_body off;
	}

	# ====== CORS-Mini-Proxy (gated by oauth2) ======
	location /api/proxy/ {
		auth_request /oauth2/auth;
		error_page 401 = @oauth2_sign_in;

		# Trailing-Slash-rewrite: /api/proxy/?url=... → http://127.0.0.1:8090/?url=...
		proxy_pass http://127.0.0.1:8090/;
		proxy_set_header Host $server_name;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Streaming-fähig (SSE/chunked transfer)
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_http_version 1.1;
		proxy_set_header Connection "";

		# Großzügige Timeouts für lange LLM-Antworten
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}

	# ====== Static Frontend ======
	#
	# .mjs-MIME-Type-Override: nginx-default mime.types (Ubuntu 24.04 / 1.24)
	# kennt .mjs nicht — pi-web-ui buendelt aber pdfjs-dist als pdf.worker.min.mjs.
	# Ohne expliziten MIME wird das Modul als application/octet-stream
	# ausgeliefert, mit X-Content-Type-Options: nosniff blockiert der Browser
	# das Worker-Loading → kein PDF-Upload moeglich (silent fail).
	# Regex-Location matcht VOR location /, beide Bloecke duplizieren auth +
	# Cache-Direktiven (nginx erbt nicht automatisch zwischen sibling-locations).
	location ~ \.mjs$ {
		auth_request /oauth2/auth;
		error_page 401 = @oauth2_sign_in;

		root /home/opipi/web-docs/dist;

		types { }
		default_type application/javascript;

		expires 365d;
		add_header Cache-Control "public, immutable" always;
	}

	location / {
		auth_request /oauth2/auth;
		error_page 401 = @oauth2_sign_in;

		root /home/opipi/web-docs/dist;
		try_files $uri $uri/ /index.html;

		# index.html nicht cachen (damit App-Updates schnell durchschlagen)
		location = /index.html {
			expires -1;
			add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		}
		# Hashed Assets aus Vite-Build → lange cachen
		location /assets/ {
			expires 365d;
			add_header Cache-Control "public, immutable" always;
		}
	}

	# Redirect zu oauth2-proxy-Sign-In bei 401
	location @oauth2_sign_in {
		return 302 /oauth2/sign_in?rd=$scheme://$server_name$request_uri;
	}

	# ACME-Challenge (für Renewal)
	location /.well-known/acme-challenge/ {
		auth_request off;
		root /var/www/html;
	}

	# Dot-files blocken
	location ~ /\.(?!well-known) {
		deny all;
	}
}
