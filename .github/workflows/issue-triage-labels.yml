name: Issue Triage Labels

on:
  issues:
    types: [reopened, labeled]

jobs:
  update-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update triage labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const UNTRIAGED_LABEL = 'untriaged';
            const NO_ACTION_LABEL = 'no-action';
            // Applying one of these labels assigns the user and reopens the issue if it is closed.
            const LABEL_ASSIGNEES = new Map([
              ['mcp', 'mitsuhiko'],
              ['codemode', 'mitsuhiko'],
              ['durable', 'badlogic'],
            ]);

            function issueHasLabel(issue, labelName) {
              return (issue.labels ?? []).some((label) => label.name === labelName);
            }

            async function removeLabelIfPresent(issueNumber, issue, labelName) {
              if (!issueHasLabel(issue, labelName)) {
                console.log(`Issue #${issueNumber} does not have ${labelName}`);
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: labelName,
                });
                console.log(`Removed ${labelName} from #${issueNumber}`);
              } catch (error) {
                if (error.status === 404) {
                  console.log(`Label ${labelName} was already absent from #${issueNumber}`);
                  return;
                }
                throw error;
              }
            }

            async function removeClosedStateLabels(issueNumber, issue) {
              await removeLabelIfPresent(issueNumber, issue, UNTRIAGED_LABEL);
              await removeLabelIfPresent(issueNumber, issue, NO_ACTION_LABEL);
            }

            if (context.payload.action === 'reopened') {
              await removeClosedStateLabels(context.issue.number, context.payload.issue);
              return;
            }

            if (context.payload.action === 'labeled' && context.payload.label?.name === NO_ACTION_LABEL) {
              await removeLabelIfPresent(context.issue.number, context.payload.issue, UNTRIAGED_LABEL);
              return;
            }

            const labelAssignee =
              context.payload.action === 'labeled' ? LABEL_ASSIGNEES.get(context.payload.label?.name) : undefined;
            if (labelAssignee) {
              const issueNumber = context.issue.number;
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [labelAssignee],
              });
              console.log(`Assigned ${labelAssignee} to #${issueNumber}`);

              if (context.payload.issue.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'open',
                });
                console.log(`Reopened #${issueNumber}`);
                // Reopening with the workflow token does not trigger the reopened handler above.
                await removeClosedStateLabels(issueNumber, context.payload.issue);
              }
            }
