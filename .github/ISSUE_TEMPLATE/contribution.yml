name: Contribution Proposal
description: Optionally discuss a proposed NLT-Pi change before implementation
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This template is an optional way to discuss a proposed change. It is not an approval gate or a prerequisite for submitting a focused pull request.
        Follow the repository's AGENTS.md, CLAUDE.md, and NLT-DEV-OTOI.md. Do not include credentials, private data, or vulnerability details in a public issue.
  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Describe the proposed change and affected NLT-Pi components.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: Explain the problem, user need, or engineering benefit.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How might it work?
      description: Optional technical approach, alternatives, and relevant trust-boundary considerations.
    validations:
      required: false
