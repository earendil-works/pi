name: Bug Report
description: Report something that is not working as expected in NLT-Pi
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report reproducible behavior in NLT-Pi. Search existing issues first.
        Do not include credentials, private data, or vulnerability details in a public issue.
        Report security concerns through the private channel in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and include sanitized error messages where useful.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence, including relevant configuration with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: NLT-Pi version or commit
      description: Include the package version or commit SHA where the issue occurs.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, runtime mode, and relevant extensions or integrations.
    validations:
      required: false
