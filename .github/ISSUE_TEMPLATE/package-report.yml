name: Package Report
description: Report a problematic package or extension in the NLT-Pi ecosystem
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a package or extension concern in the NLT-Pi ecosystem.
        Do not include credentials, private data, exploit details, or vulnerability evidence in this public form. Use the private reporting route in SECURITY.md for security concerns.
  - type: input
    id: package-name
    attributes:
      label: Package or extension name
      description: Provide the package name or repository.
      placeholder: "@scope/package"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Version
      description: The affected package version or commit.
    validations:
      required: false
  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Unsafe or unexpected behavior
        - Malicious behavior
        - Impersonation
        - Licensing or attribution concern
        - Compatibility issue
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern with sanitized links, logs, or reproduction steps.
    validations:
      required: true
